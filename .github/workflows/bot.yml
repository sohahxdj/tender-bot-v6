name: Tender Bot - 2026 Strict

on:
  schedule:
    - cron: '*/30 * * * *'  # كل 30 دقيقة
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Run bot - 2026 only
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
          
      - name: Save sent history
        run: |
          git config user.name "tender-bot"
          git config user.email "bot@github.com"
          git add sent.json || echo "no sent.json"
          git diff --quiet && git diff --staged --quiet || git commit -m "update sent 2026"
          git push || echo "nothing to push"
          
