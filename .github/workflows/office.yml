name: Office Sector Bot
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 lxml urllib3
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_office.py
      - run: |
          git config --global user.name "Office Bot"
          git config --global user.email "office@tradium.dz"
          if [! -f sent_office.json ]; then echo '{"ids":[],"count":0}' > sent_office.json; fi
          git add sent_office.json -f
          git diff --staged --quiet || git commit -m "office $(date)"
          git push || echo "ok"          
